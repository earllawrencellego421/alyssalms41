<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c14">
<title>alyssa LMS · Exams and Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a0c14; --night2:#121629; --panel:#171b2e; --line:#2a3050;
  --moon:#f4efd8; --bone:#ece7da; --mute:#9aa0b8;
  --flame:#ee5a24; --water:#2a9fd0; --thunder:#f3c52f; --wind:#3fb37f; --love:#ee7fa8; --wisteria:#9b7fd4;
  --haori-a:#0f5d3a; --haori-b:#0b0b0d;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--bone);background:var(--night);line-height:1.6;min-height:100vh;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
:focus-visible{outline:3px solid var(--thunder);outline-offset:3px}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
.checker{background:conic-gradient(var(--haori-a) 25%,var(--haori-b) 0 50%,var(--haori-a) 0 75%,var(--haori-b) 0) 0 0/24px 24px}

/* header */
header.bar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:rgba(10,12,20,.92);backdrop-filter:blur(8px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.65rem}
.bar::after{content:"";display:block;height:12px}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.brand b{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.04em}
.brand b span{color:var(--flame)}
.seal{width:38px;height:38px;border-radius:6px;background:var(--flame);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--night);transform:rotate(-4deg);box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--flame)}
.bar small{color:var(--mute)}

/* hero: moonlit night, falling petals */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--night) 0,var(--night2) 100%);border-bottom:1px solid var(--line)}
.moon{position:absolute;right:max(4%,-60px);top:-80px;width:clamp(220px,34vw,420px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fffbe8 0,var(--moon) 45%,#cfc8a2 100%);box-shadow:0 0 90px 30px rgba(244,239,216,.25);opacity:.92}
.hero .waves{position:absolute;inset:auto 0 0 0;height:46%;opacity:.55;
  background:
   radial-gradient(circle at 50% 0,transparent 0 28%,rgba(42,159,208,.35) 29% 32%,transparent 33% 44%,rgba(42,159,208,.35) 45% 48%,transparent 49%) 0 0/56px 28px,
   radial-gradient(circle at 50% 0,transparent 0 28%,rgba(42,159,208,.35) 29% 32%,transparent 33% 44%,rgba(42,159,208,.35) 45% 48%,transparent 49%) 28px 14px/56px 28px;
  -webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}
.hero .wrap{position:relative;z-index:2;padding-block:clamp(2.6rem,8vw,5.5rem);display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center}
.kicker{font-weight:700;letter-spacing:.3em;color:var(--flame);font-size:.85rem}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7.5vw,5.4rem);line-height:1.08;margin-top:.5rem}
.hero h1 span{display:inline-block;position:relative}
.hero h1 span::after{content:"";position:absolute;left:-2%;right:-2%;bottom:.06em;height:.14em;background:var(--flame);transform-origin:left;transform:skewX(-20deg);animation:slash .9s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes slash{from{transform:skewX(-20deg) scaleX(0)}to{transform:skewX(-20deg) scaleX(1)}}
.hero p{max-width:46ch;color:#c4c8dc;margin-top:1.2rem;font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem}
.stats div{background:rgba(23,27,46,.85);border:1px solid var(--line);border-left:4px solid var(--thunder);padding:.3rem 1rem}
.stats strong{font-family:var(--display);font-size:1.7rem;color:var(--thunder);display:block;line-height:1.2}
.stats span{font-size:.8rem;color:var(--mute)}
.kanji{writing-mode:vertical-rl;font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,6.5rem);letter-spacing:.12em;color:transparent;-webkit-text-stroke:2px rgba(244,239,216,.8);user-select:none}
.petals{position:absolute;inset:0;z-index:1;pointer-events:none}
.petals i{position:absolute;top:-30px;width:12px;height:18px;border-radius:70% 0 70% 0;background:var(--wisteria);opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(-120px,620px,0) rotate(540deg);opacity:0}}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;padding-block:1.6rem}
.search{flex:1 1 240px}
.search input{width:100%;font:inherit;color:var(--bone);background:var(--panel);border:2px solid var(--line);padding:.75rem 1rem;border-radius:2px}
.search input:focus{border-color:var(--water);outline:none}
.chips{display:flex;gap:.5rem}
.chip{font:inherit;font-weight:700;color:var(--bone);background:var(--panel);border:2px solid var(--line);padding:.6rem 1.2rem;min-height:46px;border-radius:2px;cursor:pointer}
.chip:hover{border-color:var(--flame)}
.chip[aria-pressed=true]{background:var(--flame);border-color:var(--flame);color:#190b05}

/* cards: each subject takes a breathing colour */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:1.4rem;padding-bottom:4rem}
.card{--c:var(--water);position:relative;background:var(--panel);border:1px solid var(--line);padding:0 0 1.2rem;display:flex;flex-direction:column;gap:1rem;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);transition:transform .2s}
.card:nth-child(6n+2){--c:var(--flame)}
.card:nth-child(6n+3){--c:var(--thunder)}
.card:nth-child(6n+4){--c:var(--wind)}
.card:nth-child(6n+5){--c:var(--love)}
.card:nth-child(6n+6){--c:var(--wisteria)}
.card:hover{transform:translateY(-4px)}
.card .strip{height:14px;background:conic-gradient(var(--c) 25%,var(--haori-b) 0 50%,var(--c) 0 75%,var(--haori-b) 0) 0 0/14px 14px}
.card header,.card .thumbs{padding-inline:1.1rem}
.card header{display:flex;gap:.9rem;align-items:center}
.patch{flex:none;min-width:56px;height:56px;padding:0 .4rem;border-radius:4px;background:var(--c);color:#12101a;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1rem;transform:rotate(-4deg);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.card h2{font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.3}
.card header p{font-size:.82rem;color:var(--mute)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem}
.thumb{position:relative;display:block;padding:0;border:2px solid var(--line);background:var(--night2);cursor:pointer;aspect-ratio:4/3;overflow:hidden;transition:border-color .15s,transform .15s}
.thumb:hover,.thumb:focus-visible{border-color:var(--c);transform:scale(1.03)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb span{position:absolute;inset:auto 0 0 0;padding:1.2rem .6rem .35rem;font-weight:900;font-size:.85rem;text-align:left;color:var(--bone);background:linear-gradient(transparent,rgba(5,6,12,.95))}
.thumb.exam span::before,.thumb.quiz span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:.45rem;transform:rotate(45deg)}
.thumb.exam span::before{background:var(--flame)}
.thumb.quiz span::before{background:var(--wisteria)}
.thumb.missing{display:grid;place-items:center;color:var(--mute);font-size:.8rem;text-align:center;padding:.5rem}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--mute);border:2px dashed var(--line)}
footer{padding:0 0 2.5rem;color:var(--mute);font-size:.85rem}
footer::before{content:"";display:block;height:12px;margin-bottom:1.4rem;background:conic-gradient(var(--haori-a) 25%,var(--haori-b) 0 50%,var(--haori-a) 0 75%,var(--haori-b) 0) 0 0/24px 24px}

/* viewer */
dialog{border:0;padding:0;width:100%;max-width:none;height:100%;max-height:none;background:var(--night);color:var(--bone)}
dialog::backdrop{background:#000}
.viewer{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.vtop,.vbot{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;background:var(--night2)}
.vtop{border-bottom:3px solid var(--flame)}
.vbot{border-top:1px solid var(--line);flex-wrap:wrap;justify-content:space-between}
.vtop h3{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:1.1rem}
.vtop h3 small{display:block;font-family:var(--body);font-weight:700;font-size:.78rem;color:var(--flame)}
.btn{font:inherit;font-weight:700;color:var(--bone);background:var(--panel);border:2px solid var(--line);border-radius:2px;padding:.4rem .9rem;min-height:46px;min-width:46px;cursor:pointer;text-decoration:none;display:inline-grid;place-items:center}
.btn:hover{border-color:var(--flame)}
.btn.close{background:var(--flame);border-color:var(--flame);color:#190b05}
.stage{overflow:auto;display:grid;place-items:center;padding:1rem;touch-action:pan-x pan-y pinch-zoom;background:radial-gradient(circle at 50% 40%,#1a2040,var(--night) 70%)}
.stage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;box-shadow:0 0 0 2px var(--line),0 0 40px rgba(42,159,208,.25)}
.stage.full{place-items:start center}
.stage.full img{max-width:none;max-height:none;cursor:zoom-out}
.tabs{display:flex;gap:.5rem;overflow-x:auto}
.tab{flex:none;font:inherit;font-weight:700;color:var(--bone);background:var(--panel);border:2px solid var(--line);padding:.4rem 1.1rem;min-height:46px;border-radius:2px;cursor:pointer}
.tab[aria-selected=true]{background:var(--water);border-color:var(--water);color:#06141c}
.acts{display:flex;gap:.5rem}

@media (max-width:640px){
  .hero .wrap{grid-template-columns:1fr}
  .kanji{writing-mode:horizontal-tb;font-size:2.4rem;order:-1}
  .moon{top:-60px;opacity:.6}
  .bar small,.btn .lbl{display:none}
  .vbot{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="alyssa LMS home">
      <div class="seal" aria-hidden="true">滅</div>
      <b>alyssa<span>LMS</span></b>
    </a>
    <small>Exam and quiz reviewer</small>
  </div>
  <div class="checker" style="height:12px;margin-top:-12px" aria-hidden="true"></div>
</header>

<main id="top">
  <section class="hero">
    <div class="moon" aria-hidden="true"></div>
    <div class="waves" aria-hidden="true"></div>
    <div class="petals" id="petals" aria-hidden="true"></div>
    <div class="wrap">
      <div>
        <div class="kicker">TOTAL CONCENTRATION</div>
        <h1>Sharpen your mind.<br>Cut through <span>every exam.</span></h1>
        <p>Choose a subject, open the exam or quiz sheet, and review it on any device. No sign-in needed.</p>
        <div class="stats" id="stats" aria-label="Library totals"></div>
      </div>
      <div class="kanji" aria-hidden="true">全集中</div>
    </div>
  </section>

  <div class="wrap">
    <div class="controls">
      <label class="search">
        <span style="position:absolute;left:-9999px">Search subjects</span>
        <input id="q" type="search" placeholder="Search a subject, like Load Testing" autocomplete="off">
      </label>
      <div class="chips" role="group" aria-label="Filter by type">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="exam" aria-pressed="false">Exams</button>
        <button class="chip" data-f="quiz" aria-pressed="false">Quizzes</button>
      </div>
    </div>
    <section class="grid" id="grid" aria-live="polite"></section>
  </div>
</main>

<footer><div class="wrap">alyssa LMS · Keep this file in the same folder as the subject folders so the images load.</div></footer>

<dialog id="viewer" aria-label="Image viewer">
  <div class="viewer">
    <div class="vtop">
      <h3 id="vtitle"></h3>
      <a class="btn" id="vopen" target="_blank" rel="noopener" aria-label="Open image in new tab">↗<span class="lbl">&nbsp;Open</span></a>
      <button class="btn close" id="vclose" aria-label="Close viewer">✕<span class="lbl">&nbsp;Close</span></button>
    </div>
    <div class="stage" id="stage"><img id="vimg" alt=""></div>
    <div class="vbot">
      <div class="acts">
        <button class="btn" id="prev" aria-label="Previous file">‹</button>
        <button class="btn" id="zoom" aria-label="Toggle full size">⤢<span class="lbl">&nbsp;Zoom</span></button>
        <button class="btn" id="next" aria-label="Next file">›</button>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
  </div>
</dialog>

<script>
/* Folder structure: edit here when you add files (e.g. add "EXAMSE1.png" to Software Engineering 1). */
const SUBJECTS = [
  {name:"Capstone Project 1", code:"CP1", dir:"Capstone Project 1", files:["EXAMPCP1.png","QUIZCP1.png"]},
  {name:"IT Practicum", code:"IT", dir:"IT Practicum", files:["EXAMIT.png","QUIZIT.png"]},
  {name:"Load Testing", code:"LT", dir:"Load Testing", files:["EXAMLT.png","QUIZLT.png"]},
  {name:"Mail and Web Services", code:"MWS", dir:"Mail and Web Services", files:["EXAMMWS.png","QUIZMWS.png"]},
  {name:"Readings in Philippine History", code:"RPH", dir:"Readings in Philippine History", files:["EXAM1RPH.png","EXAM2RPH.png","QUIZRPH.png"]},
  {name:"Software Engineering 1", code:"SE1", dir:"Software Engineering 1", files:["QUIZSE1.png"]}
];
const ROOT = ""; // index.html sits next to the subject folders

const $ = s => document.querySelector(s);
const grid=$("#grid"), dlg=$("#viewer"), vimg=$("#vimg"), stage=$("#stage");
let filter="all", query="", cur=null, idx=0;

const typeOf = f => /^EXAM/i.test(f) ? "exam" : "quiz";
const labelOf = f => { const n=(f.match(/^(?:EXAM|QUIZ)(\d)/i)||[])[1]; return (typeOf(f)==="exam"?"Exam":"Quiz")+(n?" "+n:""); };
const src = (s,f) => encodeURI(ROOT+s.dir+"/"+f);
SUBJECTS.forEach(s=>s.items=s.files.map(f=>({file:f,type:typeOf(f),label:labelOf(f),url:src(s,f)})));

/* falling wisteria petals */
$("#petals").innerHTML=Array.from({length:14},(_,i)=>
  `<i style="left:${(i*7.3+5)%100}%;animation-duration:${8+(i%5)*2}s;animation-delay:${-(i*1.7)%10}s;transform:scale(${.7+(i%3)*.3})"></i>`).join("");

const all = SUBJECTS.flatMap(s=>s.items);
$("#stats").innerHTML =
  [[SUBJECTS.length,"Subjects"],[all.filter(i=>i.type==="exam").length,"Exam sheets"],[all.filter(i=>i.type==="quiz").length,"Quiz sheets"]]
  .map(([n,l])=>`<div><strong>${n}</strong><span>${l}</span></div>`).join("");

function render(){
  const q=query.trim().toLowerCase(); grid.innerHTML="";
  let shown=0;
  SUBJECTS.forEach(s=>{
    if(q && !(s.name+" "+s.code).toLowerCase().includes(q)) return;
    const items=s.items.filter(i=>filter==="all"||i.type===filter);
    if(!items.length) return;
    shown++;
    const card=document.createElement("article"); card.className="card";
    card.style.setProperty("--n",shown);
    card.innerHTML=`<div class="strip"></div><header><div class="patch">${s.code}</div><div><h2>${s.name}</h2><p>${items.length} ${items.length>1?"files":"file"} ready to review</p></div></header><div class="thumbs"></div>`;
    const box=card.querySelector(".thumbs");
    items.forEach(it=>{
      const b=document.createElement("button");
      b.className="thumb "+it.type; b.type="button";
      b.setAttribute("aria-label",`Open ${it.label} for ${s.name}`);
      b.innerHTML=`<img loading="lazy" alt="" src="${it.url}"><span>${it.label}</span>`;
      b.querySelector("img").onerror=e=>{e.target.remove();b.classList.add("missing");b.insertAdjacentHTML("afterbegin","Image not found")};
      b.onclick=()=>openViewer(s,s.items.indexOf(it));
      box.appendChild(b);
    });
    grid.appendChild(card);
  });
  if(!shown) grid.innerHTML=`<div class="empty">No subject matches that search. Clear the box or switch the filter to All.</div>`;
}

function openViewer(s,i){ cur=s; if(!dlg.open) dlg.showModal(); show(i); }
function show(i){
  idx=(i+cur.items.length)%cur.items.length;
  const it=cur.items[idx];
  vimg.src=it.url; vimg.alt=`${it.label} for ${cur.name}`;
  $("#vtitle").innerHTML=`${cur.name}<small>${it.label}</small>`;
  $("#vopen").href=it.url;
  stage.classList.remove("full"); stage.scrollTo(0,0);
  $("#tabs").innerHTML=cur.items.map((x,n)=>`<button class="tab" role="tab" aria-selected="${n===idx}" data-n="${n}">${x.label}</button>`).join("");
  $("#prev").hidden=$("#next").hidden=cur.items.length<2;
}
$("#tabs").onclick=e=>{const t=e.target.closest(".tab"); if(t) show(+t.dataset.n)};
$("#prev").onclick=()=>show(idx-1);
$("#next").onclick=()=>show(idx+1);
$("#zoom").onclick=vimg.onclick=()=>stage.classList.toggle("full");
$("#vclose").onclick=()=>dlg.close();
dlg.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") show(idx-1);
  if(e.key==="ArrowRight") show(idx+1);
});
let sx=0;
stage.addEventListener("touchstart",e=>{sx=e.changedTouches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{
  if(stage.classList.contains("full")) return;
  const d=e.changedTouches[0].clientX-sx;
  if(Math.abs(d)>70) show(idx+(d<0?1:-1));
},{passive:true});

$("#q").addEventListener("input",e=>{query=e.target.value;render()});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
  render();
});
render();
</script>
</body>
</html>
